# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install
# Project customizations: gitflow branching + release management (see branching/release below)

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Optional branch name template. Leave empty for the default "{number}-{slug}".
# Supported tokens: {author}, {app}, {number}, {slug}
# {slug} must not appear before {number}; final path segment must start with {number}-.
# Example for monorepos: "{author}/{app}/{number}-{slug}"
branch_template: ""

# Gitflow feature namespace — expands to "feature/{number}-{slug}"
# (used by /speckit-git-feature / before_specify hook)
branch_prefix: "feature"

# Commit message used by `git commit` during repository initialization
init_commit_message: "chore: initial commit"

# Commit message style used by auto-commit hooks (speckit.git.commit):
# "fixed"        - default; use the configured/static messages below.
# "conventional" - ask the agent to inspect the diff and generate a
#                  Conventional Commit message (e.g. "feat: add OAuth spec")
#                  instead of using the messages configured below.
commit_style: conventional

# ---------------------------------------------------------------------------
# Project: gitflow branching (read by /speckit-git-hotfix, /speckit-git-release,
# /speckit-git-pr). Official Spec Kit scripts ignore unknown top-level keys.
# ---------------------------------------------------------------------------
branching:
  strategy: gitflow
  production: main
  development: develop
  prefixes:
    feature: feature
    release: release
    hotfix: hotfix
  # Ensure long-lived branches exist before creating feature/release/hotfix
  ensure_base_branches: true

# ---------------------------------------------------------------------------
# Project: release management (read by /speckit-git-release)
# ---------------------------------------------------------------------------
release:
  enabled: true
  # Where the current version lives. Supported: VERSION | package.json | pyproject.toml
  # If the file is missing, create VERSION on first release.
  version_file: VERSION
  changelog: CHANGELOG.md
  tag_prefix: v
  # auto = derive from Conventional Commits since last tag (BREAKING→major, feat→minor, else patch)
  bump: auto
  create_github_release: true
  # Branch name shape for gitflow releases: release/{tag_prefix}{version}
  branch_from: develop
  merge_targets:
    - main
    - develop

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command (used only when commit_style: fixed).
auto_commit:
  default: true
  before_clarify:
    enabled: true
    message: "chore: save progress before clarification"
  before_plan:
    enabled: true
    message: "chore: save progress before planning"
  before_tasks:
    enabled: true
    message: "chore: save progress before task generation"
  before_implement:
    enabled: true
    message: "chore: save progress before implementation"
  before_checklist:
    enabled: true
    message: "chore: save progress before checklist"
  before_analyze:
    enabled: true
    message: "chore: save progress before analysis"
  before_taskstoissues:
    enabled: true
    message: "chore: save progress before issue sync"
  after_constitution:
    enabled: true
    message: "docs: add project constitution"
  after_specify:
    enabled: true
    message: "docs: add specification"
  after_clarify:
    enabled: true
    message: "docs: clarify specification"
  after_plan:
    enabled: true
    message: "docs: add implementation plan"
  after_tasks:
    enabled: true
    message: "docs: add tasks"
  after_implement:
    enabled: true
    message: "feat: implementation progress"
  after_checklist:
    enabled: true
    message: "docs: add checklist"
  after_analyze:
    enabled: true
    message: "docs: add analysis report"
  after_taskstoissues:
    enabled: true
    message: "chore: sync tasks to issues"
