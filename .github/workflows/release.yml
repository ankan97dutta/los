name: Release builds

# Builds the macOS and Windows installers and attaches them to the GitHub
# Release for the tag. Runs on version tags, and can be dispatched by hand
# to (re)build the installers for an existing tag such as v0.1.0.
#
# The build runs through the workspace's own pnpm and Tauri CLI scripts
# rather than tauri-action: this is a pnpm monorepo, and the action's
# package manager detection does not see the root lockfile from
# apps/desktop. Install uses --ignore-scripts because better-sqlite3 (a
# node-test-only dependency of @los/persistence) needs a native toolchain
# that the Windows runner image does not provide; the desktop build does
# not need it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach installers to (for example v0.1.0)'
        required: true
        type: string
      code_ref:
        description: 'Branch or commit to build from (defaults to main; the tag only names the release)'
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref || inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build universal macOS app
        run: pnpm --filter @los/desktop exec tauri build --target universal-apple-darwin
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag || github.ref_name }}" \
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz \
            --clobber

  windows:
    name: Windows (experimental)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref || inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Windows app
        run: pnpm --filter @los/desktop exec tauri build
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ inputs.tag || github.ref_name }}" \
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi \
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe \
            --clobber
