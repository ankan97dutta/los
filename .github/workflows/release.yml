name: Release builds

# Builds the macOS and Windows installers and attaches them to the GitHub
# Release for the tag. Runs on version tags, and can be dispatched by hand
# to (re)build the installers for an existing tag such as v0.1.0.
#
# The build runs through the workspace's own pnpm and Tauri CLI scripts
# rather than tauri-action: this is a pnpm monorepo, and the action's
# package manager detection does not see the root lockfile from
# apps/desktop. Install uses --ignore-scripts because better-sqlite3 (a
# node-test-only dependency of @los/persistence) needs a native toolchain
# that the Windows runner image does not provide; the desktop build does
# not need it.
#
# Version truth is the git tag: each job rewrites the version field of
# tauri.conf.json in its checkout from the tag before building, so the
# installer file names and the in-app version always match the release,
# even if the committed tauri.conf.json was not bumped. The VERSION file
# at the repo root is still bumped by the release process and is checked
# against the tag; a mismatch fails the build instead of shipping a
# mislabelled installer.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach installers to (for example v0.1.0)'
        required: true
        type: string
      code_ref:
        description: 'Branch or commit to build from (defaults to main; the tag only names the release)'
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref || inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Sync app version from the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag '$RELEASE_TAG' is not a v-prefixed semver tag" >&2
            exit 1
          fi
          if [ -f VERSION ]; then
            FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
            if [ "$FILE_VERSION" != "$VERSION" ]; then
              echo "VERSION file says $FILE_VERSION but the release tag is $RELEASE_TAG; bump VERSION or fix the tag" >&2
              exit 1
            fi
          fi
          APP_VERSION="$VERSION" node -e "const fs=require('fs');const p='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');console.log('tauri.conf.json version set to '+c.version);"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build universal macOS app
        run: pnpm --filter @los/desktop exec tauri build --target universal-apple-darwin
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag || github.ref_name }}" \
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            --clobber

  windows:
    name: Windows (experimental)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref || inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Sync app version from the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag '$RELEASE_TAG' is not a v-prefixed semver tag" >&2
            exit 1
          fi
          if [ -f VERSION ]; then
            FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
            if [ "$FILE_VERSION" != "$VERSION" ]; then
              echo "VERSION file says $FILE_VERSION but the release tag is $RELEASE_TAG; bump VERSION or fix the tag" >&2
              exit 1
            fi
          fi
          APP_VERSION="$VERSION" node -e "const fs=require('fs');const p='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');console.log('tauri.conf.json version set to '+c.version);"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Windows app
        run: pnpm --filter @los/desktop exec tauri build
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ inputs.tag || github.ref_name }}" \
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi \
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe \
            --clobber
